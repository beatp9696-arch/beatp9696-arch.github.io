name: build & validate

# รัน build.py ทุกครั้งที่ push/PR เพื่อ:
#   1) generate sitemap/feed/toc/itemlist/thumbnail/stocks/hero ใหม่ + validate โครงสร้าง
#   2) ตรวจ "drift" — ถ้าไฟล์ที่ build.py generate ยังไม่ถูก commit (ลืมรัน build.py ก่อน push)
#      job จะ fail พร้อมบอกให้รัน build.py แล้ว commit
# หมายเหตุ: sitemap.xml / feed.xml มี field ที่ขึ้นกับเวลา/เครื่อง (lastmod, lastBuildDate)
# จึงไม่เอามา gate drift — gate เฉพาะไฟล์ที่ deterministic จาก source
# app.min.js กับ casestudy.min.css ต้องอยู่ในลิสต์ด้วย: build.py generate ทั้งคู่ และ
# 81 หน้าโหลด app.min.js จริง ถ้าไม่ gate = แก้ app.js แล้วลืมรัน build.py ได้ CI เขียว
# แต่เว็บจริงเสิร์ฟ JS ตัวเก่า

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ติดตั้ง ImageMagick (build.py ใช้แทน sips บน Linux สำหรับ thumbnail)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: รัน build.py (generate + validate)
        run: |
          python3 build.py
          python3 test/bookshelf-build.test.py

      # เทสต์ทั้ง 5 ชุดไม่เคยอยู่ใน CI — รันแต่ในเครื่องตอนที่นึกได้ (builder test ของ
      # smart-money เป็น python ต้องการ source XML จึงยังไม่เอาเข้า job นี้)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: รันเทสต์ (sync merge, research, smart money, stock, market hours)
        run: for f in app/test/*.test.mjs; do echo "── $f"; node "$f" || exit 1; done

      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r app/test/requirements-browser.txt
          python3 -m playwright install --with-deps chromium

      - name: Portfolio and Smart Money browser workflows
        run: |
          python3 app/test/reading-flow-browser.test.py
          python3 app/test/money-browser.test.py
          python3 app/test/money-multitab-browser.test.py
          python3 app/test/portfolio-browser.test.py
          python3 app/test/living-thesis-browser.test.py
          python3 app/test/smart-money-browser.test.py
          python3 app/test/smart-money-stock-browser.test.py
          python3 test/bookshelf-browser.test.py

      - name: ตรวจ drift — ไฟล์ที่ generate ต้องถูก commit มาแล้ว
        run: |
          if ! git diff --exit-code -- \
              articles.html index.html stocks.html books.html books/ 'series-*.html' \
              style.min.css casestudy.min.css app.min.js articles/ scenes/*.min.css; then
            echo "::error::build.py แก้ไฟล์ด้านบน = ยังไม่ได้ commit ผล generate — รัน 'python3 build.py' แล้ว commit ก่อน push"
            exit 1
          fi
