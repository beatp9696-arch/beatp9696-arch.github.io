<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ย้ายแล้ว — Moatrices</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="/smart-money.html">
  <meta http-equiv="refresh" content="0; url=/smart-money.html">
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0f1215;color:#e8eaed;
      font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;text-align:center;padding:24px}
    a{color:#5bd6a4}
  </style>
</head>
<body>
  <div>
    <p>แอปย้ายมาอยู่ในเว็บ Moatrices แล้ว — ข้อมูลของคุณอยู่ครบเหมือนเดิม</p>
    <p><a href="/smart-money.html">ไปต่อที่ Smart Money →</a></p>
  </div>
  <script>
    // ถอน service worker ตัวเก่าให้เกลี้ยงก่อน แล้วค่อยเด้ง — ไม่งั้นเครื่องที่ติดตั้ง PWA ไว้
    // จะถูก SW เดิมเสิร์ฟหน้าเก่าจาก cache ต่อไป ไม่มีวันเห็นหน้าใหม่
    (async function () {
      try {
        if ("serviceWorker" in navigator) {
          for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
        }
        if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
      } catch (e) {}
      location.replace("/smart-money.html");
    })();
  </script>
</body>
</html>
